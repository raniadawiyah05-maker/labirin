<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Misi Penyelamatan di Labirin Ajaib</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <div id="lvl">Misi Penyelamatan di Labirin Ajaib</div>
    <button id="btnSnd" class="btn small" aria-label="Pengaturan suara">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15 8a5 5 0 0 1 0 8M17.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      Suara
    </button>
  </header>
  <main id="stage">
    <canvas id="cv" width="352" height="320"></canvas>
    <div id="arena"></div>
    <div id="toast"></div>
  </main>
  <div id="dpad" aria-label="Tombol arah">
    <button class="dp" data-d="up" aria-label="Atas"></button>
    <button class="dp" data-d="left" aria-label="Kiri"></button>
    <button class="dp" data-d="right" aria-label="Kanan"></button>
    <button class="dp" data-d="down" aria-label="Bawah"></button>
  </div>
  <div id="panel" hidden></div>
  <div id="set" hidden></div>
  <div id="fade"></div>
</div>
<script src="js/levels.js"></script>
<script src="js/questions.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
